name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump from the last tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version instead of a bump, e.g. 0.2.0
        type: string
        default: ""
      dry_run:
        description: Build and write the notes, publish nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Check for signing secrets
        id: config
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$CERTIFICATE_P12" ] && [ -n "$NOTARY_KEY_P8" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "footer=.github/release-notes-notarized.md" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization are on"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "footer=.github/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets; the build is ad-hoc signed and Gatekeeper will prompt on first launch"
          fi

      - name: Pick the version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && [ "$(git rev-list --count "$last..HEAD")" = 0 ]; then
            echo "::error::No commits since $last, nothing to release"
            exit 1
          fi
          version='${{ inputs.version }}'
          [ -n "$version" ] || version=$(swift Scripts/release.swift next-version "${last#v}" '${{ inputs.bump }}')
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: ${last:-none})"

      - name: Write release notes
        env:
          RELEASE_FOOTER: ${{ steps.config.outputs.footer }}
        run: |
          mkdir -p Build
          swift Scripts/release.swift notes '${{ steps.version.outputs.last }}' '${{ steps.version.outputs.version }}' | tee Build/notes.md

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        if: steps.config.outputs.signing == 'true'
        id: certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Signing as $identity"

      - name: Build app bundle
        run: |
          make app VERSION='${{ steps.version.outputs.version }}' BUILD_NUMBER=${{ github.run_number }} \
            SIGN_IDENTITY='${{ steps.certificate.outputs.identity || '-' }}'

      - name: Notarize and staple
        if: steps.config.outputs.signing == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent Build/Lanes.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple Build/Lanes.app
          spctl --assess --type execute --verbose=2 Build/Lanes.app

      - name: Zip
        run: ditto -c -k --keepParent Build/Lanes.app 'Build/Lanes-${{ steps.version.outputs.version }}.zip'

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "Build/Lanes-$VERSION.zip" \
            --title "Lanes $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file Build/notes.md

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Lanes-${{ steps.version.outputs.version }}-dry-run
          path: |
            Build/Lanes-*.zip
            Build/notes.md
