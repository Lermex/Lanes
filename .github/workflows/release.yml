name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: macos-26
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app VERSION=$VERSION BUILD_NUMBER=${{ github.run_number }}

      - name: Zip
        run: ditto -c -k --keepParent Build/Lanes.app "Build/Lanes-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Build/Lanes-$VERSION.zip" \
            --title "Lanes $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md \
            --generate-notes
