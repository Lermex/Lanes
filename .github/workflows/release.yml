name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump from the last tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version instead of a bump, e.g. 0.2.0
        type: string
        default: ""
      dry_run:
        description: Build and write the notes, publish nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Pick the version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && [ "$(git rev-list --count "$last..HEAD")" = 0 ]; then
            echo "::error::No commits since $last, nothing to release"
            exit 1
          fi
          version='${{ inputs.version }}'
          [ -n "$version" ] || version=$(swift Scripts/release.swift next-version "${last#v}" '${{ inputs.bump }}')
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: ${last:-none})"

      - name: Write release notes
        run: |
          mkdir -p Build
          swift Scripts/release.swift notes '${{ steps.version.outputs.last }}' '${{ steps.version.outputs.version }}' | tee Build/notes.md

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app VERSION='${{ steps.version.outputs.version }}' BUILD_NUMBER=${{ github.run_number }}

      - name: Zip
        run: ditto -c -k --keepParent Build/Lanes.app 'Build/Lanes-${{ steps.version.outputs.version }}.zip'

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "Build/Lanes-$VERSION.zip" \
            --title "Lanes $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file Build/notes.md

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Lanes-${{ steps.version.outputs.version }}-dry-run
          path: |
            Build/Lanes-*.zip
            Build/notes.md
